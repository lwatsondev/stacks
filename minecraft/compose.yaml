---
services:
  minecraft:
    image: "itzg/minecraft-server:latest"
    container_name: "minecraft"
    restart: "unless-stopped"
    read_only: true
    user: "${PUID:-1000}:${PGID:-1000}"
    depends_on:
      mariadb:
        condition: "service_healthy"
    stdin_open: true
    tty: true
    stop_grace_period: "60s"
    env_file:
      - path: ".env"
        required: false
      - path: "stack.env"
        required: false
    environment:
      EULA: "TRUE"
    volumes:
      - "${BASE_DIR:-.}/config/minecraft:/config:ro"
      - "${BASE_DIR:-.}/data/minecraft:/data"
    networks:
      - "minecraft"
    ports:
      - "25565:25565"
    healthcheck:
      test:
        - "CMD"
        - "mc-health"
      start_period: "5m"
      interval: "30s"
      timeout: "10s"

  mariadb:
    image: "mariadb:latest"
    container_name: "minecraft-mariadb"
    restart: "unless-stopped"
    init: true
    read_only: true
    user: "${PUID:-1000}:${PGID:-1000}"
    mem_limit: "512m"
    memswap_limit: "512m"
    env_file:
      - path: ".env"
        required: false
      - path: "stack.env"
        required: false
    volumes:
      - "${BASE_DIR:-.}/data/mariadb:/var/lib/mysql"
      - "${BASE_DIR:-.}/config/mariadb:/etc/mysql/conf.d:ro"
    networks:
      - "minecraft"
    healthcheck:
      test:
        - "CMD"
        - "healthcheck.sh"
        - "--connect"
        - "--innodb_initialized"
      start_period: "10s"
      interval: "10s"
      timeout: "5s"

networks:
  minecraft:
    name: "minecraft"
