---
services:
  vaultwarden:
    image: "vaultwarden/server:latest"
    container_name: "vaultwarden"
    restart: "unless-stopped"
    init: true
    read_only: true
    user: "${VAULTWARDEN_PUID:-${PUID:-1000}}:${VAULTWARDEN_PGID:-${PGID:-1000}}"
    depends_on:
      postgres:
        condition: "service_healthy"
    env_file:
      - path: ".env"
        required: false
      - path: "stack.env"
        required: false
    environment:
      TZ: "${TZ:-UTC}"
      DATABASE_URL: "${DATABASE_URL:-postgresql://${POSTGRES_USER:-vaultwarden}:${POSTGRES_PASSWORD:-vaultwarden}@${POSTGRES_HOST:-postgres}:${POSTGRES_PORT:-5432}/${POSTGRES_DB:-vaultwarden}}"
      ADMIN_TOKEN: "${ADMIN_TOKEN:?}"
    volumes:
      - "${BASE_DIR:-.}/data/vaultwarden:/data"
    networks:
      - "vaultwarden"
    deploy:
      resources:
        limits:
          cpus: "${VAULTWARDEN_CPU_LIMIT:-${CPU_LIMIT:-0}}"
          memory: "${VAULTWARDEN_MEM_LIMIT:-${MEM_LIMIT:-0}}"
    healthcheck:
      test:
        - "CMD"
        - "/healthcheck.sh"
      start_period: "10s"
      start_interval: "1s"
      interval: "10s"
      timeout: "5s"

  postgres:
    image: "postgres:18"
    container_name: "vaultwarden-postgres"
    restart: "unless-stopped"
    init: true
    user: "${POSTGRES_PUID:-${PUID:-1000}}:${POSTGRES_PGID:-${PGID:-1000}}"
    networks:
      - "vaultwarden"
    command:
      - "postgres"
      - "-c"
      - "config_file=/etc/postgresql/postgresql.conf"
    environment:
      TZ: "${TZ:-UTC}"
      POSTGRES_DB: "${POSTGRES_DB:-vaultwarden}"
      POSTGRES_USER: "${POSTGRES_USER:-vaultwarden}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-vaultwarden}"
    volumes:
      - "${BASE_DIR:-.}/data/postgres:/var/lib/postgresql"
      - "${BASE_DIR:-.}/config/postgres:/etc/postgresql"
    healthcheck:
      test:
        - "CMD-SHELL"
        - "pg_isready -q --dbname=$$POSTGRES_DB --username=$$POSTGRES_USER --host=127.0.0.1"
      start_period: "10s"
      start_interval: "1s"
      interval: "10s"
      timeout: "5s"
    shm_size: "${SHM_SIZE:-128M}"
    deploy:
      resources:
        limits:
          cpus: "${POSTGRES_CPU_LIMIT:-${CPU_LIMIT:-0}}"
          memory: "${POSTGRES_MEM_LIMIT:-${MEM_LIMIT:-0}}"

networks:
  vaultwarden:
    name: "vaultwarden"
